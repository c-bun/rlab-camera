[project]
name = "rlab-camera"
version = "0.1.0"
description = "Lab imaging app for the Raspberry Pi HQ camera"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# On-device panel firmware is MicroPython/CircuitPython (uasyncio, @micropython.native,
# board-specific modules) — it isn't CPython and can't lint as such. The Pi-side CPython
# helpers under panel_firmware/tools/ stay linted.
extend-exclude = ["panel_firmware/micropython", "panel_firmware/code.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
