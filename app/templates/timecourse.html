<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rlab-camera · timecourse</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>rlab-camera</h1>
    <nav class="nav">
      <a href="/">Capture</a>
      <a href="/timecourse" class="active">Timecourse</a>
    </nav>
    <span class="badge">backend: {{ backend }}</span>
  </header>

  <main>
    <section id="controls-panel">
      <!-- Setup: shown when no run is active. -->
      <div id="setup-panel">
        <h2>New timecourse</h2>
        <div class="field">
          <label for="exp-name">Name</label>
          <input id="exp-name" type="text" placeholder="e.g. plate A, 6h" autocomplete="off">
        </div>
        <div class="field">
          <label for="exp-notes">Experimental details (optional)</label>
          <textarea id="exp-notes" rows="3" placeholder="Sample, conditions, anything worth recording…"></textarea>
        </div>
        <div class="field">
          <label for="exp-interval">Interval (s)</label>
          <input id="exp-interval" type="number" min="0.1" step="0.1" value="30">
        </div>
        <div class="field">
          <label for="exp-duration">Duration (s)</label>
          <input id="exp-duration" type="number" min="0.1" step="1" value="3600">
        </div>
        <p id="frame-estimate" class="meta"></p>

        <h2>Capture settings</h2>
        <form id="controls-form"><!-- built from /api/controls --></form>

        <div id="presets-panel">
          <h2>Presets</h2>
          <ul id="presets-list"><!-- built from /api/presets --></ul>
        </div>

        <button id="start-btn" type="button">Start run</button>
      </div>

      <!-- Running: shown while a run is active (or after it finishes, until reset). -->
      <div id="running-panel" hidden>
        <h2>Run in progress</h2>
        <h3 id="run-name"></h3>
        <p id="run-notes" class="run-notes"></p>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <p id="run-progress"></p>
        <button id="stop-btn" type="button">Stop run</button>
        <button id="new-btn" type="button" hidden>New run</button>
      </div>

      <p id="status"></p>
    </section>

    <section id="gallery-panel">
      <h2>Frames</h2>
      <div id="gallery"></div>
    </section>
  </main>

  <script src="/static/controls.js"></script>
  <script src="/static/timecourse.js"></script>
</body>
</html>
