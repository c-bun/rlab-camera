<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rlab-camera</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>rlab-camera</h1>
    <span class="badge">backend: {{ backend }}</span>
  </header>

  <main>
    <section id="controls-panel">
      <h2>Manual controls</h2>
      <form id="controls-form"><!-- built from /api/controls --></form>
      <div id="preview-panel">
        <button id="preview-btn" type="button">Start live view</button>
        <img id="preview" alt="live preview" hidden>
      </div>
      <button id="capture-btn" type="button">Capture</button>
      <p id="status"></p>

      <div id="presets-panel">
        <h2>Presets</h2>
        <div class="preset-row">
          <input id="preset-name" type="text" placeholder="Preset name" autocomplete="off">
          <button id="save-preset-btn" type="button">Save preset</button>
        </div>
        <ul id="presets-list"><!-- built from /api/presets --></ul>
      </div>
    </section>

    <section id="gallery-panel">
      <h2>Captures</h2>
      <div id="gallery"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
